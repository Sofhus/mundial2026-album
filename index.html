<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Álbum Mundial 2026 — by Shift</title>
    <meta name="description" content="Tracker de estampas Panini FIFA Mundial 2026. Marca lo que tienes, ve qué te falta, exporta tu lista para cambios." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1B3A8C" />
    <link rel="icon" type="image/png" href="/icon.png" />

    <!-- iOS home-screen install -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mundial 2026" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Open Graph (WhatsApp / FB / Twitter preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Álbum Mundial 2026 — Tracker" />
    <meta property="og:description" content="Lleva el control de tus estampas Panini Mundial 2026. Hecho por Shift." />
    <meta property="og:image" content="/icon.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', "'Helvetica Neue'", 'Helvetica', 'Arial', 'sans-serif'],
              display: ['Bebas Neue', 'Impact', "'Arial Narrow'", 'Arial', 'sans-serif'],
            },
            colors: {
              brand:    '#1B3A8C',
              'brand-dark': '#142D6E',
              accent:   '#D4AF37',
              success:  '#16A34A',
              pending:  '#A1A1AA',
              duplicate:'#57534E',
              error:    '#DC2626',
              page:     '#F8F7F4',
            }
          }
        }
      }
    </script>
    <style>
      * { -webkit-user-select: none; user-select: none; }
      input, textarea, select { -webkit-user-select: text; user-select: text; }
      html { font-family: 'Outfit', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      body { background: #F8F7F4; }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: #EDEBE7; }
      ::-webkit-scrollbar-thumb { background: #C4C0B8; border-radius: 3px; }
      .surface { background: #fff; border: 1px solid #E5E2DB; border-radius: 16px; box-shadow: 0 1px 4px rgba(28,25,23,0.06); }
      .surface-sm { background: #fff; border: 1px solid #E5E2DB; border-radius: 12px; box-shadow: 0 1px 4px rgba(28,25,23,0.06); }
      @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }
      .pop { animation: pop 0.12s ease-out; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
